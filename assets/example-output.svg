<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Fictional App Store Connect review status example</title>
  <desc id="description">A fictional app named Example Reader, version 1.2.0 for iOS, is waiting for review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="1" stop-color="#10152d"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <rect x="96" y="105" width="1008" height="470" rx="24" fill="#3457d5" opacity="0.18" filter="url(#glow)"/>
  <rect x="98" y="96" width="1004" height="478" rx="24" fill="#081321" stroke="url(#border)" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="150" y="165" fill="#93a7ff" font-size="34" font-weight="700">App Store Connect Review Status</text>

    <g stroke="#334155" stroke-width="1">
      <line x1="138" y1="195" x2="1062" y2="195"/>
      <line x1="138" y1="265" x2="1062" y2="265"/>
      <line x1="138" y1="335" x2="1062" y2="335"/>
      <line x1="138" y1="405" x2="1062" y2="405"/>
      <line x1="138" y1="485" x2="1062" y2="485"/>
    </g>

    <g font-size="24">
      <text x="150" y="240" fill="#b8c1d1">App</text>
      <text x="1050" y="240" fill="#f8fafc" text-anchor="end">Example Reader</text>
      <text x="150" y="310" fill="#b8c1d1">Version</text>
      <text x="1050" y="310" fill="#f8fafc" text-anchor="end">1.2.0</text>
      <text x="150" y="380" fill="#b8c1d1">Platform</text>
      <text x="1050" y="380" fill="#f8fafc" text-anchor="end">IOS</text>
    </g>

    <circle cx="162" cy="447" r="11" fill="#4ade80"/>
    <text x="190" y="456" fill="#4ade80" font-size="25" font-weight="700">WAITING FOR REVIEW</text>
    <text x="150" y="535" fill="#b8c1d1" font-size="22">Checked</text>
    <text x="1050" y="535" fill="#f8fafc" font-size="22" text-anchor="end">2026-01-15 09:00 UTC</text>
  </g>
</svg>
